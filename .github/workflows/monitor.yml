name: 票务库存检测

on:
  workflow_dispatch:
  schedule:
    - cron: '2-59/5 * * * *'

permissions:
  contents: read

jobs:
  check-stock:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装 Playwright 和 Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: 检查库存
        run: python watch.py
